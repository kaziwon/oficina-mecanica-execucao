name: Integracao continua - Execucao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OficinaMecanica.Execucao.slnx
      - run: dotnet build OficinaMecanica.Execucao.slnx --configuration Release --no-restore

  test:
    name: Testes e cobertura
    # MongoDB 8 falha em kernels recentes usados pelo ubuntu-latest (SERVER-121912).
    runs-on: ubuntu-22.04
    needs: build
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_CONNECTION_STRING: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OficinaMecanica.Execucao.slnx
      - run: >-
          dotnet test OficinaMecanica.Execucao.slnx --configuration Release --no-restore
          --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Publicar relatorios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-execucao
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
