name: Integracao continua - Execucao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar workflows do GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OficinaMecanica.Execucao.slnx
      - run: dotnet build OficinaMecanica.Execucao.slnx --configuration Release --no-restore

  test:
    name: Testes e cobertura
    # MongoDB 8 falha em kernels recentes usados pelo ubuntu-latest (SERVER-121912).
    runs-on: ubuntu-22.04
    needs: build
    services:
      sqs:
        image: softwaremill/elasticmq:1.7.1
        ports: ["9324:9324"]
    env:
      SQS_TEST_ENDPOINT: http://127.0.0.1:9324
      MONGODB_TEST_CONNECTION_STRING: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Iniciar MongoDB com transacoes locais
        run: |
          docker run --detach --name mongo --hostname mongo --publish 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in {1..60}; do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'; then break; fi
            sleep 1
          done
          docker exec --interactive mongo mongosh --quiet --file /dev/stdin < infra/local/mongo-replica-init.js
      - run: dotnet restore OficinaMecanica.Execucao.slnx
      - run: >-
          dotnet test OficinaMecanica.Execucao.slnx --configuration Release --no-restore
          --settings cobertura.runsettings --collect:"XPlat Code Coverage"
          --logger trx --results-directory TestResults
      - name: Exigir cobertura minima de 80%
        run: python3 tools/verificar_cobertura.py --servico Execucao --diretorio TestResults --json TestResults/cobertura-resumo.json
      - name: Publicar relatorios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-execucao
          path: |
            TestResults/**/coverage.cobertura.xml
            TestResults/**/coverage.opencover.xml
            TestResults/cobertura-resumo.json
            TestResults/**/*.trx
          if-no-files-found: warn
      - name: Encerrar MongoDB de teste
        if: always()
        run: docker rm --force mongo

  kubernetes:
    name: Kubernetes e deploy local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar seguranca do CD e manifestos
        run: |
          python3 -m pip install -r tests/deployment/requirements.txt
          python3 -m unittest discover -s tests/deployment -v
      - name: Validar Terraform sem provisionamento
        run: |
          terraform -chdir=infra/kubernetes init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/kubernetes fmt -check -recursive
          terraform -chdir=infra/kubernetes validate
