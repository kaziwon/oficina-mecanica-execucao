services:
  elasticmq:
    image: softwaremill/elasticmq:1.7.1
    ports:
      - "127.0.0.1::9324"

  mongo:
    image: mongo:8.0
    hostname: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1::27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (!db.adminCommand({ping:1}).ok) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 60
